name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: go-task/setup-task@v2
      - run: task install
      - run: task check
      - run: task package
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node build/release.ts notes "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.zip --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  # Submits the released package for review; listing, screenshots and privacy answers stay in the dashboard
  chrome:
    needs: release
    runs-on: ubuntu-latest
    environment: Chrome
    steps:
      - name: Download the Chrome package from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'polished-github-chrome-*.zip'
      - name: Upload and publish to the Chrome Web Store
        env:
          EXTENSION_ID: bdmfdhhfmbkfbgomeefpchhgfbapjbpg
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx chrome-webstore-upload-cli@4.0.2 --source polished-github-chrome-*.zip
