version: '3'

vars:
  REPO_URL: https://github.com/vmaerten/polished-github
  # One package per browser: Firefox's also declares the background script, see build/firefox.ts
  PACKAGES:
    map:
      chrome: distribution
      firefox: distribution-firefox
  # The package each web-ext target loads
  TARGET_PACKAGES:
    map:
      chromium: chrome
      firefox-desktop: firefox
  VERSION_PATTERN: '^[0-9]+\.[0-9]+\.[0-9]+$'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies
    cmds:
      - pnpm install --frozen-lockfile

  build:
    desc: Build the extension into {{.PACKAGES.chrome}}/ for Chrome and {{.PACKAGES.firefox}}/ for Firefox
    cmds:
      - pnpm exec tsdown
      - node build/firefox.ts

  dev:
    desc: Rebuild {{.PACKAGES.chrome}}/ on every change
    cmds:
      - pnpm exec tsdown --watch

  start:
    desc: 'Open a browser with the built extension loaded (TARGET=firefox-desktop for Firefox)'
    vars:
      TARGET: '{{.TARGET | default "chromium"}}'
    requires:
      vars:
        - name: TARGET
          enum: [chromium, firefox-desktop]
    cmds:
      - pnpm exec web-ext run --source-dir {{get .PACKAGES (get .TARGET_PACKAGES .TARGET)}} --target {{.TARGET}} --start-url {{.REPO_URL}}

  website:dev:
    desc: Serve the website with live reload
    dir: website
    cmds:
      - pnpm exec astro dev

  website:build:
    desc: Build the website into website/dist/
    dir: website
    cmds:
      - pnpm exec astro build

  lint:
    desc: Lint and check formatting
    cmds:
      - pnpm exec oxlint --type-aware --deny-warnings
      - pnpm exec oxfmt --check

  format:
    desc: 'Format every file, or the ones given: task format -- README.md'
    cmds:
      - pnpm exec oxfmt {{.CLI_ARGS}}

  typecheck:
    desc: Type-check TypeScript and Svelte files
    cmds:
      # svelte-check never removes the components it transpiled, so a deleted one would keep failing
      - rm -rf .svelte-check
      - pnpm exec svelte-check --tsgo --fail-on-warnings

  test:
    desc: 'Run the unit tests, or the matching ones: task test -- quick-comments'
    cmds:
      - pnpm exec vitest run {{.CLI_ARGS}}

  check:
    desc: Run every check CI runs
    deps: [lint, typecheck, test]
    cmds:
      - task: build
      - pnpm exec web-ext lint --source-dir {{.PACKAGES.firefox}}
      - task: website:build

  package:
    desc: 'Zip each browser package into web-ext-artifacts/:{{range $browser, $_ := .PACKAGES}} polished-github-{{$browser}}-<version>.zip{{end}}'
    deps: [build]
    vars:
      VERSION:
        sh: jq -r .version package.json
    cmds:
      - for: {var: PACKAGES}
        cmd: pnpm exec web-ext build --source-dir {{.ITEM}} --artifacts-dir web-ext-artifacts --filename polished-github-{{.KEY}}-{{.VERSION}}.zip --overwrite-dest

  release:
    desc: 'Release a version from main, e.g. task release VERSION=1.2.0'
    requires:
      vars: [VERSION]
    vars:
      TAG: v{{.VERSION}}
      BRANCH:
        sh: git branch --show-current
      # The files `build/release.ts bump` rewrites
      BUMPED: [package.json, source/manifest.json, CHANGELOG.md]
    prompt: Release {{.TAG}} and push it to origin?
    preconditions:
      # `true` and `false` are commands: the template decides which one runs
      - sh: '{{regexMatch .VERSION_PATTERN .VERSION}}'
        msg: 'VERSION must look like 1.2.0, not "{{.VERSION}}"'
      - sh: '{{eq .BRANCH "main"}}'
        msg: 'Releases are cut from main, not {{.BRANCH}}'
      - sh: git diff --quiet HEAD
        msg: Commit or stash your changes first
    cmds:
      - task: check
      - node build/release.ts bump {{.VERSION}}
      - pnpm exec oxfmt {{.BUMPED | join " "}}
      - git add {{.BUMPED | join " "}}
      - 'git commit -m "chore(release): {{.TAG}}"'
      - git tag {{.TAG}}
      # Atomic: the tag triggers the release workflow, which must find the release commit on main
      - git push --atomic origin main {{.TAG}}
