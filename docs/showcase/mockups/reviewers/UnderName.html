<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pending reviews under the name</title>
		<style>
			body {
				margin: 0;
			}
			a {
				color: #4493f8;
			}
			a:hover {
				color: #79b8ff;
			}
		</style>
	</head>
	<body>
		<div
			style="
				width: 360px;
				height: 440px;
				box-sizing: border-box;
				padding: 24px 30px;
				background: #0d1117;
				color: #f0f6fc;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
			"

			<div
				style="
					width: 300px;
					border: 1px solid #3d444d;
					border-radius: 12px;
					background: #151b23;
					overflow: hidden;
					box-shadow: 0 8px 24px rgba(1, 4, 9, 0.6);
				"
			>
				<div style="padding: 10px 16px; font-size: 12px; font-weight: 600">Request up to 15 reviewers</div>
				<div style="padding: 0 16px 10px">
					<label for="find-2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"
						>Find a user</label
					>
					<input
						id="find-2"
						type="text"
						placeholder="Find a user"

							width: 100%;
							box-sizing: border-box;
							height: 32px;
							padding: 0 10px;
							border: 2px solid #1f6feb;
							border-radius: 6px;
							background: #0d1117;
							color: #f0f6fc;
							font-size: 14px;
						"

						border-top: 1px solid #3d444d;

						font-size: 12px;
						font-weight: 600;
					"
				>
					Suggestions
				</div>

				<div style="display: flex; align-items: flex-start; gap: 8px; padding: 8px 16px; border-top: 1px solid #3d444d">
					<span
						style="
							flex: none;
							width: 20px;
							height: 20px;
							border-radius: 50%;
							background: #a5d6ff;
							color: #0d1117;
							font-size: 10px;
							font-weight: 700;
							display: flex;
							align-items: center;
							justify-content: center;
						"

					<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">

							><span style="font-weight: 600">andreynering</span>
							<span style="color: #9198a1; font-size: 12px">Andrey Nering</span></span
						>
						<span style="font-size: 12px; color: #9198a1">Recently edited these files</span>

							title="8 open PRs waiting for their review in go-task"
							style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #9198a1"
						>
							<svg
								width="12"
								height="12"
								viewBox="0 0 16 16"
								fill="none"
								stroke="#db6d28"
								stroke-width="1.5"
								stroke-linecap="round"
								stroke-linejoin="round"
								aria-hidden="true"
							>
								<path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"></path>
								<circle cx="8" cy="8" r="2"></circle>
							</svg>
							<span><span style="color: #db6d28; font-weight: 600">8</span> pending reviews</span>
						</span>
					</div>
				</div>

				<div style="display: flex; align-items: flex-start; gap: 8px; padding: 8px 16px; border-top: 1px solid #3d444d">

							height: 20px;
							border-radius: 50%;

							</svg>
							<span><span style="color: #d29922; font-weight: 600">5</span> pending reviews</span>
						</span>

						padding: 6px 16px;
						border-top: 1px solid #3d444d;
						background: #0d1117;
						font-size: 12px;
						font-weight: 600;

							font-size: 10px;
							font-weight: 700;
							display: flex;
							align-items: center;
							justify-content: center;

								<path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"></path>
								<circle cx="8" cy="8" r="2"></circle>
							</svg>
							<span><span style="color: #9198a1; font-weight: 600">0</span> pending reviews</span>
						</span>
